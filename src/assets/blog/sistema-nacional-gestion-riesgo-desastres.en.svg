<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <text x="600" y="55" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--diagram-ink)">SNGRD: Law 1523 of 2012, three pillars</text>

  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="var(--diagram-ink)" />
    </marker>
  </defs>

  <!-- top: UNGRD -->
  <rect x="440" y="95" width="320" height="70" fill="var(--diagram-ink)" stroke="var(--diagram-ink)" stroke-width="2" />
  <text x="600" y="128" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--color-surface)">UNGRD</text>
  <text x="600" y="150" text-anchor="middle" font-size="13" fill="var(--color-surface)">national coordination</text>

  <!-- connectors -->
  <path d="M 600 165 L 600 200 L 210 200 L 210 235" stroke="var(--diagram-ink)" stroke-width="2" fill="none" marker-end="url(#arrow3)" />
  <path d="M 600 165 L 600 235" stroke="var(--diagram-ink)" stroke-width="2" fill="none" marker-end="url(#arrow3)" />
  <path d="M 600 165 L 600 200 L 990 200 L 990 235" stroke="var(--diagram-ink)" stroke-width="2" fill="none" marker-end="url(#arrow3)" />

  <!-- pillar 1 -->
  <rect x="80" y="238" width="260" height="150" fill="var(--diagram-fill)" stroke="var(--diagram-accent)" stroke-width="2.5" />
  <text x="210" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-accent)">Knowledge</text>
  <text x="210" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-accent)">of risk</text>
  <text x="210" y="330" text-anchor="middle" font-size="13" fill="var(--diagram-ink)">microzonation,</text>
  <text x="210" y="350" text-anchor="middle" font-size="13" fill="var(--diagram-ink)">hazard monitoring</text>

  <!-- pillar 2 -->
  <rect x="470" y="238" width="260" height="150" fill="var(--diagram-fill)" stroke="var(--diagram-accent)" stroke-width="2.5" />
  <text x="600" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-accent)">Reduction</text>
  <text x="600" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-accent)">of risk</text>
  <text x="600" y="330" text-anchor="middle" font-size="13" fill="var(--diagram-ink)">land-use planning,</text>
  <text x="600" y="350" text-anchor="middle" font-size="13" fill="var(--diagram-ink)">NSR-10 code</text>

  <!-- pillar 3 -->
  <rect x="860" y="238" width="260" height="150" fill="var(--diagram-fill)" stroke="var(--diagram-accent)" stroke-width="2.5" />
  <text x="990" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-accent)">Disaster</text>
  <text x="990" y="296" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-accent)">management</text>
  <text x="990" y="330" text-anchor="middle" font-size="13" fill="var(--diagram-ink)">response, EDAN,</text>
  <text x="990" y="350" text-anchor="middle" font-size="13" fill="var(--diagram-ink)">recovery</text>

  <!-- municipal row -->
  <rect x="260" y="450" width="680" height="70" fill="var(--diagram-accent-2)" fill-opacity="0.12" stroke="var(--diagram-accent-2)" stroke-width="2" stroke-dasharray="6 4" />
  <text x="600" y="492" text-anchor="middle" font-size="15" fill="var(--diagram-accent-2)">Municipal risk management councils and plans (CMGRD)</text>

  <path d="M 210 388 L 500 450" stroke="var(--diagram-ink)" stroke-width="1.5" fill="none" stroke-dasharray="4 3" />
  <path d="M 600 388 L 600 450" stroke="var(--diagram-ink)" stroke-width="1.5" fill="none" stroke-dasharray="4 3" />
  <path d="M 990 388 L 700 450" stroke="var(--diagram-ink)" stroke-width="1.5" fill="none" stroke-dasharray="4 3" />

  <text x="600" y="580" text-anchor="middle" font-size="14" fill="var(--diagram-ink)">Cascading system: each territorial level reports up to the national level</text>
</svg>
