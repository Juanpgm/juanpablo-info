<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#f7f8fa" />

  <text x="600" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a2027">Interacción de placas y sistema de fallas (corte esquemático)</text>

  <!-- crust layers -->
  <rect x="80" y="140" width="480" height="60" fill="#dde1e6" stroke="#1a2027" stroke-width="2" />
  <text x="320" y="175" text-anchor="middle" font-size="18" fill="#1a2027">Placa Nazca (oceánica)</text>

  <rect x="640" y="120" width="480" height="80" fill="#dde1e6" stroke="#1a2027" stroke-width="2" />
  <text x="880" y="165" text-anchor="middle" font-size="18" fill="#1a2027">Placa Suramericana (continental)</text>

  <!-- subduction slab -->
  <path d="M 560 200 L 760 480" stroke="#0f766e" stroke-width="10" fill="none" />
  <text x="700" y="330" font-size="16" fill="#0f766e" transform="rotate(58 700 330)">Zona de subducción</text>

  <!-- mantle -->
  <rect x="80" y="200" width="1040" height="330" fill="#eef1f4" stroke="#dde1e6" stroke-width="2" />
  <text x="150" y="500" font-size="16" fill="#1a2027">Manto superior</text>

  <!-- fault system Cauca-Romeral -->
  <line x1="900" y1="120" x2="960" y2="480" stroke="#b45309" stroke-width="6" stroke-dasharray="10 6" />
  <text x="975" y="300" font-size="16" fill="#b45309">Sistema de fallas</text>
  <text x="975" y="322" font-size="16" fill="#b45309">Cauca-Romeral</text>

  <!-- arrows showing convergence -->
  <path d="M 420 130 L 500 130" stroke="#1a2027" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 780 100 L 700 100" stroke="#1a2027" stroke-width="3" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a2027" />
    </marker>
  </defs>

  <!-- hypocenter -->
  <circle cx="700" cy="330" r="8" fill="#b45309" />
  <text x="716" y="335" font-size="16" fill="#1a2027">Hipocentro (foco)</text>

  <text x="600" y="600" text-anchor="middle" font-size="15" fill="#1a2027">Cali se ubica cerca de la traza del sistema Cauca-Romeral, dentro de una zona de amenaza sísmica alta (NSR-10)</text>
</svg>
