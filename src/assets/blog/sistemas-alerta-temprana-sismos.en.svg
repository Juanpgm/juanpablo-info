<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <text x="600" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--diagram-ink)">Anatomy of a seismic early warning alert</text>

  <!-- pipeline boxes -->
  <rect x="60" y="110" width="220" height="90" rx="8" fill="var(--diagram-fill)" stroke="var(--diagram-accent)" stroke-width="3" />
  <text x="170" y="150" text-anchor="middle" font-size="17" fill="var(--diagram-ink)">Seismic sensor</text>
  <text x="170" y="172" text-anchor="middle" font-size="17" fill="var(--diagram-ink)">network</text>

  <rect x="340" y="110" width="220" height="90" rx="8" fill="var(--diagram-fill)" stroke="var(--diagram-accent)" stroke-width="3" />
  <text x="450" y="150" text-anchor="middle" font-size="17" fill="var(--diagram-ink)">Telemetry and</text>
  <text x="450" y="172" text-anchor="middle" font-size="17" fill="var(--diagram-ink)">data pipeline</text>

  <rect x="620" y="110" width="220" height="90" rx="8" fill="var(--diagram-fill)" stroke="var(--diagram-accent)" stroke-width="3" />
  <text x="730" y="150" text-anchor="middle" font-size="17" fill="var(--diagram-ink)">Magnitude/epicenter</text>
  <text x="730" y="172" text-anchor="middle" font-size="17" fill="var(--diagram-ink)">estimation</text>

  <rect x="900" y="110" width="220" height="90" rx="8" fill="var(--diagram-fill)" stroke="var(--diagram-accent-2)" stroke-width="3" />
  <text x="1010" y="150" text-anchor="middle" font-size="17" fill="var(--diagram-ink)">Alert</text>
  <text x="1010" y="172" text-anchor="middle" font-size="17" fill="var(--diagram-ink)">broadcast</text>

  <path d="M 280 155 L 335 155" stroke="var(--diagram-ink)" stroke-width="3" marker-end="url(#arrow2)" />
  <path d="M 560 155 L 615 155" stroke="var(--diagram-ink)" stroke-width="3" marker-end="url(#arrow2)" />
  <path d="M 840 155 L 895 155" stroke="var(--diagram-ink)" stroke-width="3" marker-end="url(#arrow2)" />

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="var(--diagram-ink)" />
    </marker>
  </defs>

  <!-- timeline: P-wave vs S-wave gap -->
  <text x="600" y="270" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--diagram-ink)">Timeline: the gap between P-waves and S-waves</text>

  <line x1="120" y1="420" x2="1080" y2="420" stroke="var(--diagram-ink)" stroke-width="2" />

  <circle cx="200" cy="420" r="7" fill="var(--diagram-accent)" />
  <text x="200" y="450" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">Fault</text>
  <text x="200" y="470" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">rupture</text>

  <circle cx="450" cy="420" r="7" fill="var(--diagram-accent)" />
  <text x="450" y="450" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">P-wave detected</text>
  <text x="450" y="470" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">(fast, low damage)</text>

  <circle cx="850" cy="420" r="7" fill="var(--diagram-accent-2)" />
  <text x="850" y="450" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">S-wave arrives</text>
  <text x="850" y="470" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">(slow, destructive)</text>

  <path d="M 450 400 L 850 400" stroke="var(--diagram-accent-2)" stroke-width="4" />
  <text x="650" y="390" text-anchor="middle" font-size="16" fill="var(--diagram-accent-2)">seconds of lead time</text>

  <circle cx="1000" cy="420" r="7" fill="var(--diagram-ink)" />
  <text x="1000" y="450" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">Alert received</text>
  <text x="1000" y="470" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">by the user</text>
</svg>
