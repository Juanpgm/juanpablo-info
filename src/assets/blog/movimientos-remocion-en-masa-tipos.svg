<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <text x="600" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--diagram-ink)">Tipos de movimientos de remoción en masa</text>

  <!-- panel 1: caida/desprendimiento -->
  <rect x="40" y="100" width="260" height="440" fill="var(--diagram-fill)" stroke="var(--diagram-line)" stroke-width="2" />
  <text x="170" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--diagram-ink)">Caída</text>
  <path d="M 60 500 L 260 500 L 260 460 L 180 300 L 60 300 Z" fill="var(--diagram-fill)" stroke="var(--diagram-ink)" stroke-width="2" />
  <circle cx="150" cy="330" r="9" fill="var(--diagram-accent-2)" />
  <path d="M 150 330 L 150 480" stroke="var(--diagram-accent-2)" stroke-width="3" stroke-dasharray="4 4" />
  <text x="170" y="530" text-anchor="middle" font-size="13" fill="var(--diagram-ink)">caída libre de bloques</text>

  <!-- panel 2: deslizamiento rotacional -->
  <rect x="320" y="100" width="260" height="440" fill="var(--diagram-fill)" stroke="var(--diagram-line)" stroke-width="2" />
  <text x="450" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--diagram-ink)">Deslizamiento rotacional</text>
  <path d="M 340 500 L 580 500 L 580 420 Q 460 340 340 420 Z" fill="var(--diagram-fill)" stroke="var(--diagram-ink)" stroke-width="2" />
  <path d="M 350 420 Q 460 340 570 420" stroke="var(--diagram-accent)" stroke-width="3" fill="none" stroke-dasharray="6 4" />
  <text x="450" y="530" text-anchor="middle" font-size="13" fill="var(--diagram-ink)">superficie de falla curva</text>

  <!-- panel 3: flujo de detritos -->
  <rect x="600" y="100" width="260" height="440" fill="var(--diagram-fill)" stroke="var(--diagram-line)" stroke-width="2" />
  <text x="730" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--diagram-ink)">Flujo de detritos</text>
  <path d="M 620 500 L 840 500 L 840 460 L 730 260 L 620 400 Z" fill="var(--diagram-fill)" stroke="var(--diagram-ink)" stroke-width="2" />
  <path d="M 700 340 Q 740 400 780 460" stroke="var(--diagram-accent-2)" stroke-width="5" fill="none" />
  <text x="730" y="530" text-anchor="middle" font-size="13" fill="var(--diagram-ink)">masa saturada en movimiento</text>

  <!-- panel 4: reptacion -->
  <rect x="880" y="100" width="260" height="440" fill="var(--diagram-fill)" stroke="var(--diagram-line)" stroke-width="2" />
  <text x="1010" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="var(--diagram-ink)">Reptación</text>
  <path d="M 900 500 L 1120 500 L 1120 460 L 980 320 L 900 380 Z" fill="var(--diagram-fill)" stroke="var(--diagram-ink)" stroke-width="2" />
  <path d="M 930 480 L 950 440" stroke="var(--diagram-accent)" stroke-width="3" />
  <path d="M 970 480 L 985 430" stroke="var(--diagram-accent)" stroke-width="3" />
  <path d="M 1010 480 L 1020 420" stroke="var(--diagram-accent)" stroke-width="3" />
  <text x="1010" y="530" text-anchor="middle" font-size="13" fill="var(--diagram-ink)">deformación lenta y continua</text>
</svg>
