<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <text x="600" y="55" text-anchor="middle" font-size="24" font-weight="bold" fill="var(--diagram-ink)">EDAN: damage and needs assessment flow</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="var(--diagram-ink)" />
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="60" y="230" width="230" height="130" fill="var(--diagram-fill)" stroke="var(--diagram-line)" stroke-width="2" />
  <circle cx="175" cy="275" r="20" fill="var(--diagram-accent-2)" />
  <path d="M 165 275 L 172 283 L 188 265" stroke="var(--color-surface)" stroke-width="3" fill="none" />
  <text x="175" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-ink)">Event</text>
  <text x="175" y="342" text-anchor="middle" font-size="13" fill="var(--diagram-ink)">earthquake, flood,</text>
  <text x="175" y="358" text-anchor="middle" font-size="13" fill="var(--diagram-ink)">mass movement</text>

  <path d="M 292 295 L 350 295" stroke="var(--diagram-ink)" stroke-width="3" marker-end="url(#arrow2)" />

  <!-- step 2 -->
  <rect x="352" y="230" width="230" height="130" fill="var(--diagram-accent)" stroke="var(--diagram-accent)" stroke-width="2" />
  <text x="467" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--color-surface)">Initial</text>
  <text x="467" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--color-surface)">assessment (fast)</text>
  <text x="467" y="335" text-anchor="middle" font-size="13" fill="var(--color-surface)">first hours</text>

  <path d="M 584 295 L 642 295" stroke="var(--diagram-ink)" stroke-width="3" marker-end="url(#arrow2)" />

  <!-- step 3 -->
  <rect x="644" y="230" width="240" height="130" fill="var(--diagram-accent)" stroke="var(--diagram-accent)" stroke-width="2" />
  <text x="764" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--color-surface)">Complementary</text>
  <text x="764" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--color-surface)">assessment</text>
  <text x="764" y="335" text-anchor="middle" font-size="13" fill="var(--color-surface)">following days, by sector</text>

  <path d="M 886 295 L 944 295" stroke="var(--diagram-ink)" stroke-width="3" marker-end="url(#arrow2)" />

  <!-- step 4 -->
  <rect x="946" y="230" width="200" height="130" fill="var(--diagram-fill)" stroke="var(--diagram-line)" stroke-width="2" />
  <rect x="985" y="255" width="120" height="80" fill="none" stroke="var(--diagram-ink)" stroke-width="2" />
  <line x1="1000" y1="275" x2="1090" y2="275" stroke="var(--diagram-ink)" stroke-width="2" />
  <line x1="1000" y1="295" x2="1090" y2="295" stroke="var(--diagram-ink)" stroke-width="2" />
  <line x1="1000" y1="315" x2="1060" y2="315" stroke="var(--diagram-ink)" stroke-width="2" />
  <text x="1046" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="var(--diagram-ink)">Report</text>

  <text x="600" y="450" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">Infrastructure · Housing · Services · Affected population</text>
  <text x="600" y="480" text-anchor="middle" font-size="14" fill="var(--diagram-ink)">Standardized data at every stage, consolidable across municipalities</text>
</svg>
