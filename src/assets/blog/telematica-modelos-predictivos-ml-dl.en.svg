<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <text x="600" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--diagram-ink)">Pipeline from sensor to real-time prediction</text>

  <!-- sensors -->
  <circle cx="120" cy="330" r="10" fill="var(--diagram-accent)" />
  <circle cx="120" cy="280" r="10" fill="var(--diagram-accent)" />
  <circle cx="120" cy="380" r="10" fill="var(--diagram-accent)" />
  <text x="120" y="240" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">Telematics</text>
  <text x="120" y="258" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">sensors</text>

  <path d="M 150 330 L 250 330" stroke="var(--diagram-ink)" stroke-width="3" marker-end="url(#a5)" />

  <!-- streaming ingestion -->
  <rect x="260" y="280" width="190" height="100" rx="10" fill="var(--diagram-fill)" stroke="var(--diagram-line)" stroke-width="2" />
  <text x="355" y="320" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">Streaming ingestion</text>
  <text x="355" y="342" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">+ feature engineering</text>

  <path d="M 460 330 L 550 330" stroke="var(--diagram-ink)" stroke-width="3" marker-end="url(#a5)" />

  <!-- ML/DL model -->
  <rect x="560" y="270" width="200" height="120" rx="10" fill="var(--diagram-fill)" stroke="var(--diagram-accent)" stroke-width="3" />
  <text x="660" y="310" text-anchor="middle" font-size="16" fill="var(--diagram-accent)" font-weight="bold">ML / DL model</text>
  <circle cx="600" cy="345" r="8" fill="var(--diagram-accent)" opacity="0.6" />
  <circle cx="630" cy="360" r="8" fill="var(--diagram-accent)" opacity="0.6" />
  <circle cx="660" cy="335" r="8" fill="var(--diagram-accent)" opacity="0.6" />
  <circle cx="690" cy="360" r="8" fill="var(--diagram-accent)" opacity="0.6" />
  <circle cx="720" cy="345" r="8" fill="var(--diagram-accent)" opacity="0.6" />

  <path d="M 770 330 L 860 330" stroke="var(--diagram-ink)" stroke-width="3" marker-end="url(#a5)" />

  <defs>
    <marker id="a5" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="var(--diagram-ink)" />
    </marker>
  </defs>

  <!-- prediction curve -->
  <rect x="870" y="230" width="260" height="200" fill="var(--diagram-fill)" stroke="var(--diagram-line)" stroke-width="2" />
  <text x="1000" y="220" text-anchor="middle" font-size="14" fill="var(--diagram-ink)">Predicted risk indicator</text>
  <line x1="890" y1="410" x2="1110" y2="410" stroke="var(--diagram-ink)" stroke-width="1.5" />
  <line x1="890" y1="410" x2="890" y2="250" stroke="var(--diagram-ink)" stroke-width="1.5" />
  <polyline points="890,390 930,385 960,360 990,340 1010,300" fill="none" stroke="var(--diagram-ink)" stroke-width="3" />
  <polyline points="1010,300 1040,270 1070,255 1100,250" fill="none" stroke="var(--diagram-accent-2)" stroke-width="4" stroke-dasharray="6 4" />
  <text x="1050" y="245" font-size="13" fill="var(--diagram-accent-2)">alert</text>

  <text x="600" y="600" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">From raw sensor signal to an actionable alert: the same flow behind an early warning system</text>
</svg>
