<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <text x="600" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="var(--diagram-ink)">From GNSS point to ground deformation model</text>

  <!-- stage 1: GNSS point -->
  <circle cx="150" cy="330" r="30" fill="var(--diagram-fill)" stroke="var(--diagram-accent)" stroke-width="4" />
  <circle cx="150" cy="330" r="6" fill="var(--diagram-accent)" />
  <text x="150" y="230" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">GNSS station</text>
  <text x="150" y="250" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">/ InSAR</text>

  <path d="M 190 330 L 300 330" stroke="var(--diagram-ink)" stroke-width="3" marker-end="url(#a4)" />

  <!-- stage 2: ingestion/processing box -->
  <rect x="310" y="270" width="220" height="120" rx="10" fill="var(--diagram-fill)" stroke="var(--diagram-line)" stroke-width="2" />
  <text x="420" y="310" text-anchor="middle" font-size="16" fill="var(--diagram-ink)">Ingestion and</text>
  <text x="420" y="332" text-anchor="middle" font-size="16" fill="var(--diagram-ink)">noise filtering</text>
  <text x="420" y="368" text-anchor="middle" font-size="13" fill="var(--diagram-accent)">ETL pipeline</text>

  <path d="M 540 330 L 650 330" stroke="var(--diagram-ink)" stroke-width="3" marker-end="url(#a4)" />

  <!-- stage 3: time-series analysis box -->
  <rect x="660" y="270" width="220" height="120" rx="10" fill="var(--diagram-fill)" stroke="var(--diagram-line)" stroke-width="2" />
  <text x="770" y="310" text-anchor="middle" font-size="16" fill="var(--diagram-ink)">Time-series</text>
  <text x="770" y="332" text-anchor="middle" font-size="16" fill="var(--diagram-ink)">analysis</text>
  <text x="770" y="368" text-anchor="middle" font-size="13" fill="var(--diagram-accent)">trend + velocity</text>

  <path d="M 890 330 L 970 330" stroke="var(--diagram-ink)" stroke-width="3" marker-end="url(#a4)" />

  <defs>
    <marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="var(--diagram-ink)" />
    </marker>
  </defs>

  <!-- deformation chart -->
  <rect x="980" y="230" width="180" height="200" fill="var(--diagram-fill)" stroke="var(--diagram-line)" stroke-width="2" />
  <text x="1070" y="220" text-anchor="middle" font-size="14" fill="var(--diagram-ink)">Deformation model</text>
  <polyline points="1000,400 1030,395 1060,385 1090,360 1120,320 1150,270"
    fill="none" stroke="var(--diagram-accent-2)" stroke-width="4" />
  <line x1="1000" y1="410" x2="1160" y2="410" stroke="var(--diagram-ink)" stroke-width="1.5" />
  <line x1="1000" y1="410" x2="1000" y2="240" stroke="var(--diagram-ink)" stroke-width="1.5" />

  <text x="600" y="600" text-anchor="middle" font-size="15" fill="var(--diagram-ink)">The same data pipeline pattern used in security observatories works for ground geodetic monitoring</text>
</svg>
