<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Arial, Helvetica, sans-serif">
  <rect width="1200" height="630" fill="#f7f8fa" />

  <text x="600" y="55" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a2027">EDAN: flujo de evaluación de daños y necesidades</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a2027" />
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="60" y="230" width="230" height="130" fill="#ffffff" stroke="#dde1e6" stroke-width="2" />
  <circle cx="175" cy="275" r="20" fill="#b45309" />
  <path d="M 165 275 L 172 283 L 188 265" stroke="#f7f8fa" stroke-width="3" fill="none" />
  <text x="175" y="320" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2027">Evento</text>
  <text x="175" y="342" text-anchor="middle" font-size="13" fill="#1a2027">sismo, inundación,</text>
  <text x="175" y="358" text-anchor="middle" font-size="13" fill="#1a2027">remoción en masa</text>

  <path d="M 292 295 L 350 295" stroke="#1a2027" stroke-width="3" marker-end="url(#arrow2)" />

  <!-- step 2 -->
  <rect x="352" y="230" width="230" height="130" fill="#0f766e" stroke="#0f766e" stroke-width="2" />
  <text x="467" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#f7f8fa">Evaluación</text>
  <text x="467" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#f7f8fa">inicial (rápida)</text>
  <text x="467" y="335" text-anchor="middle" font-size="13" fill="#f7f8fa">primeras horas</text>

  <path d="M 584 295 L 642 295" stroke="#1a2027" stroke-width="3" marker-end="url(#arrow2)" />

  <!-- step 3 -->
  <rect x="644" y="230" width="240" height="130" fill="#0f766e" stroke="#0f766e" stroke-width="2" />
  <text x="764" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#f7f8fa">Evaluación</text>
  <text x="764" y="305" text-anchor="middle" font-size="16" font-weight="bold" fill="#f7f8fa">complementaria</text>
  <text x="764" y="335" text-anchor="middle" font-size="13" fill="#f7f8fa">días siguientes, por sector</text>

  <path d="M 886 295 L 944 295" stroke="#1a2027" stroke-width="3" marker-end="url(#arrow2)" />

  <!-- step 4 -->
  <rect x="946" y="230" width="200" height="130" fill="#ffffff" stroke="#dde1e6" stroke-width="2" />
  <rect x="985" y="255" width="120" height="80" fill="none" stroke="#1a2027" stroke-width="2" />
  <line x1="1000" y1="275" x2="1090" y2="275" stroke="#1a2027" stroke-width="2" />
  <line x1="1000" y1="295" x2="1090" y2="295" stroke="#1a2027" stroke-width="2" />
  <line x1="1000" y1="315" x2="1060" y2="315" stroke="#1a2027" stroke-width="2" />
  <text x="1046" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a2027">Reporte</text>

  <text x="600" y="450" text-anchor="middle" font-size="15" fill="#1a2027">Infraestructura · Vivienda · Servicios · Población afectada</text>
  <text x="600" y="480" text-anchor="middle" font-size="14" fill="#1a2027">Datos estandarizados en cada etapa, consolidables entre municipios</text>
</svg>
