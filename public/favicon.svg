<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- Minimalist microchip mark: rounded chip body, 12 leads, pin-1 accent dot. -->
    <g class="chip-body">
        <rect x="36" y="36" width="56" height="56" rx="10" />
        <rect x="45" y="26" width="6" height="10" rx="1.5" />
        <rect x="61" y="26" width="6" height="10" rx="1.5" />
        <rect x="77" y="26" width="6" height="10" rx="1.5" />
        <rect x="45" y="92" width="6" height="10" rx="1.5" />
        <rect x="61" y="92" width="6" height="10" rx="1.5" />
        <rect x="77" y="92" width="6" height="10" rx="1.5" />
        <rect x="26" y="45" width="10" height="6" rx="1.5" />
        <rect x="26" y="61" width="10" height="6" rx="1.5" />
        <rect x="26" y="77" width="10" height="6" rx="1.5" />
        <rect x="92" y="45" width="10" height="6" rx="1.5" />
        <rect x="92" y="61" width="10" height="6" rx="1.5" />
        <rect x="92" y="77" width="10" height="6" rx="1.5" />
    </g>
    <circle class="chip-accent" cx="46" cy="46" r="4" />
    <style>
        .chip-body { fill: #1a2027; }
        .chip-accent { fill: #0f766e; }
        @media (prefers-color-scheme: dark) {
            .chip-body { fill: #f2ede6; }
            .chip-accent { fill: #2dd4bf; }
        }
    </style>
</svg>
